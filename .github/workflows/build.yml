name: build-asi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan compiler MSVC 32-bit (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile steerbridge.asi
        shell: cmd
        run: cl /LD /O2 /EHsc /MT steerbridge.cpp /Fe:steerbridge.asi

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: steerbridge-asi
          path: steerbridge.asi
